<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>verty-web</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div class="bg-overlay"></div>
    <main class="dashboard">
      <section class="time-section">
        <h1 id="clock">00:00</h1>
        <p id="greeting">Hello, traveler.</p>
      </section>
      <form action="https://google.com/search" method="GET" class="search-form">
        <input type="text" name="q" placeholder="Ask Google..." autocomplete="off" autofocus>
      </form>
      <section class="links-grid">
        <a href="https://github.com" class="link-card">Github</a>
        <a href="https://youtube.com" class="link-card">YouTube</a>
        <a href="https://discord.gg" class="link-card">Discord</a>
        <a href="https://chatgpt.com" class="link-card">ChatGPT</a>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
